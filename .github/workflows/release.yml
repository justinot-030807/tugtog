name: Build and Release Tugtog APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch plugins namespace for AGP 8
        run: |
          find /home/runner/.pub-cache/hosted/pub.dev/on_audio_query_android-*/android/build.gradle -type f 2>/dev/null | while read -r file; do
            if ! grep -q "namespace" "$file"; then
              echo "Patching on_audio_query_android namespace in $file"
              sed -i "/android {/a \    namespace 'com.lucasjosino.on_audio_query'" "$file"
            fi
          done
          find /home/runner/.pub-cache/hosted/pub.dev/ -name "build.gradle" -type f 2>/dev/null | while read -r file; do
            if grep -q "com.android.library" "$file" && ! grep -q "namespace" "$file"; then
              echo "Patching library namespace in $file"
              sed -i "/android {/a \    namespace 'com.lucasjosino.on_audio_query'" "$file"
            fi
          done

      - name: Ensure .env exists for asset bundling
        run: |
          if [ ! -f .env ]; then
            echo "Creating .env asset fallback"
            echo "JAMENDO_CLIENT_ID=56d30c95" > .env
            echo "AUDIUS_APP_NAME=tugtog" >> .env
          fi

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tugtog-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Tugtog {0}', github.ref_name) || 'Tugtog v1.0.0 Release' }}
          body: |
            ## Tugtog Music Player 🎵
            Kasama sa release na ito ang pinakabagong bersyon ng Tugtog APK.
            
            ### Paano I-install sa Android:
            1. I-download ang `app-release.apk` sa ibaba.
            2. Buksan ang file sa iyong Android phone at pindutin ang **Install**.
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
